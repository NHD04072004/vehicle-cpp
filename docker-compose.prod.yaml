#####################################################
#   PRODUCTION — docker compose up -d
#   Image đã build sẵn bởi deploy.sh, không build từ source.
#   Copy sang target bởi ./deploy.sh — sửa file này rồi chạy lại deploy.sh.
#####################################################
services:
  vehicle:
    image: nhd04072004/vehicle-app:1.0.0
    pull_policy: never
    container_name: vehicle
    restart: unless-stopped
    runtime: nvidia
    privileged: true

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    volumes:
      - ./resources/config:/app/resources/config
      - ./resources/ds:/app/resources/ds
      - ./resources/weights:/app/resources/weights

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

    environment:
      - TZ=Asia/Ho_Chi_Minh
      - NVIDIA_VISIBLE_DEVICES=1
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - LD_PRELOAD=${LD_PRELOAD:-}
      - TCMALLOC_RELEASE_RATE=${TCMALLOC_RELEASE_RATE:-10}
      - MALLOC_ARENA_MAX=2
      - MALLOC_MMAP_THRESHOLD_=131072
      - MALLOC_TRIM_THRESHOLD_=131072
      - VEHICLE_LOG_LEVEL=${VEHICLE_LOG_LEVEL:-info}
      - VEHICLE_MEM_STATS=${VEHICLE_MEM_STATS:-0}
      - USE_NEW_NVSTREAMMUX=yes
      - WARP_DEBUG=${WARP_DEBUG:-0}

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  default:
    name: vehicle_network
    driver: bridge
    ipam:
      config:
        - subnet: 10.28.2.0/24
          gateway: 10.28.2.1
